name: Publicar jogo online (GitHub Pages)

# Requer: Settings → Pages → Source = "GitHub Actions" (uma única vez).
# Depois disso, rode este workflow manualmente ou reative o gatilho de push.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Testes
        run: node scripts/test.cjs && node scripts/test-map.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./www

      - id: deployment
        uses: actions/deploy-pages@v4
